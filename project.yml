name: TuesdayApp
options:
  bundleIdPrefix: sh.tuesday
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "GWBBWC9V34"
    CODE_SIGN_STYLE: Automatic

targets:
  TuesdayApp:
    type: application
    platform: iOS
    sources:
      - path: TuesdayApp
    info:
      path: TuesdayApp/Info.plist
      properties:
        CFBundleDisplayName: Tuesday.sh
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Tuesday.sh uses the camera to capture hardware device photos, barcodes, serial numbers, QR codes, and MAC labels for GCP Gemini AI device inventory discovery."
        NSPhotoLibraryUsageDescription: "Tuesday.sh uses your photo library to analyze photos of routers, switches, and IoT devices for inventory discovery."
        NSLocalNetworkUsageDescription: "Tuesday.sh connects to your Home Assistant HACS integration on your local Wi-Fi network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.app
        INFOPLIST_FILE: TuesdayApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TuesdayAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuesdayAppTests
    dependencies:
      - target: TuesdayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TuesdayApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TuesdayApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TuesdayAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TuesdayAppUITests
    dependencies:
      - target: TuesdayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.app.uitests
        GENERATE_INFOPLIST_FILE: YES

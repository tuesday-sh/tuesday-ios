name: TuesdayApp
options:
  bundleIdPrefix: sh.tuesday
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: "C64X2B2J54"
    CODE_SIGN_STYLE: Automatic

targets:
  TuesdayApp:
    type: application
    platform: iOS
    sources:
      - path: TuesdayApp
        excludes:
          - "Resources/*.storekit"
      - path: TuesdayApp/Resources/TuesdayProducts.storekit
        buildPhase: none
    dependencies:
      - sdk: libz.tbd
      - sdk: StoreKit.framework
    info:
      path: TuesdayApp/Info.plist
      properties:
        CFBundleDisplayName: Tuesday.sh
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - IBMPlexSans-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: sh.tuesday.pro
            CFBundleURLSchemes:
              - tuesday
        NSCameraUsageDescription: "Tuesday.sh uses the camera to capture hardware device photos, barcodes, serial numbers, QR codes, and MAC labels for hardware discovery. Photos are processed ephemerally in memory and are never stored on Tuesday.sh servers."
        NSPhotoLibraryUsageDescription: "Tuesday.sh uses your photo library to analyze photos of routers, switches, and IoT devices for inventory discovery."
        NSLocalNetworkUsageDescription: "Tuesday.sh connects to your Home Assistant HACS integration on your local Wi-Fi network."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.pro
        INFOPLIST_FILE: TuesdayApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  TuesdayAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuesdayAppTests
    dependencies:
      - target: TuesdayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.pro.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TuesdayApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TuesdayApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TuesdayAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TuesdayAppUITests
    dependencies:
      - target: TuesdayApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.tuesday.pro.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TuesdayApp:
    build:
      targets:
        TuesdayApp: all
        TuesdayAppTests: [test]
        TuesdayAppUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: TuesdayApp/Resources/TuesdayProducts.storekit
    test:
      config: Debug
      storeKitConfiguration: TuesdayApp/Resources/TuesdayProducts.storekit
      targets:
        - TuesdayAppTests
        - TuesdayAppUITests
    archive:
      config: Release
